<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructor+</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1>Instructor<span>+</span></h1>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn btn-primary">Sign In</button>
        <div id="login-error" class="error"></div>
      </form>
      <p class="muted">First time? <a href="#" id="show-setup">Create admin account</a></p>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand">Instructor<span>+</span></div>
      <nav id="nav"></nav>
      <div class="user-info">
        <span id="user-name"></span>
        <span id="user-role" class="badge"></span>
        <button id="signout" class="btn btn-sm">Sign Out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="page-title">Dashboard</h1>
      </header>
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
